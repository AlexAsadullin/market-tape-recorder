# Parameters of the experiments behind docs/report.md (make report). All data are synthetic.
# Override the file with TAPE_REPORT_CONFIG_FILE.

seed: 20261022
bootstrap_resamples: 10000
reports_subdir: reports          # under $TRADEQ_DATA_DIR/market-tape-recorder/

# Synthetic streams per venue (experiments/synthetic.py describes the generating process).
streams:
  binance: {messages: 600,  interval_ms: 100, interval_kind: fixed,       snapshot_every: 100, latency_ms: 3, jitter_ms: 1}
  bybit:   {messages: 1500, interval_ms: 20,  interval_kind: fixed,       snapshot_every: 250, latency_ms: 3, jitter_ms: 1}
  okx:     {messages: 2000, interval_ms: 10,  interval_kind: exponential, snapshot_every: 250, latency_ms: 3, jitter_ms: 1}

# Experiment 1: one injected fault per run; does each method notice it?
detection:
  runs: 200
  venues: [binance, bybit, okx]
  faults: [clean, drop, reorder, cross, resubscribe, duplicate]
  fault_window: [0.1, 0.7]          # the fault hits a delta frame in this share of the stream
  resubscribe_gap_ms: [300, 3000]   # the re-subscription gap range that Tardis documents
  duplicate_delay_ms: [1, 50]
  gap_monitor_ratio: 3.0            # baseline: flag an inter-arrival gap above 3x the median

# Experiment 2: planned reconnects of a live session against a fake broadcast server.
rotation:
  runs: 20
  duration_s: 3.0
  message_interval_ms: 2
  connect_ms: [50, 250]             # connect + subscribe latency of each new connection
  rotate_after_s: 0.25
  modes:
    naive:           {redundant_connections: 1, overlap_rotation: false}
    overlap:         {redundant_connections: 1, overlap_rotation: true}
    naive_redundant: {redundant_connections: 2, overlap_rotation: false}

# Experiment 3: two capture regions with independent losses, merged by earliest arrival.
regions:
  runs: 100
  venue: bybit
  stream: {messages: 2000, interval_ms: 20, interval_kind: fixed, snapshot_every: 250, latency_ms: 0, jitter_ms: 0}
  drop_probability: 0.002           # each delta frame is lost independently in each region
  outage_gap_ms: [300, 3000]        # one blind re-subscription per region and run
  outage_window: [0.1, 0.8]
  regions:
    eu:    {latency_ms: 10, jitter_ms: 30}
    tokyo: {latency_ms: 20, jitter_ms: 30}
