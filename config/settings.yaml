# Market Tape Recorder (I1) defaults. Every value can be overridden by env: TAPE_<SECTION>__<KEY>.
# The data root comes from TRADEQ_DATA_DIR; secrets (API keys) only from env.

region: eu-local

paths:
  project_subdir: market-tape-recorder
  tape: tape                          # contract 6.2 canonical tape
  captures: captures/region={region}  # per-region captures, merged into tape/ by merge-regions
  staging: staging                    # in-progress Parquet files (never visible under tape/)
  certificates: certificates          # contract 6.2 certificates for tape/
  latency: latency                    # merge-regions latency distributions
  archives: archives                  # monthly archive bundles
  raw: raw                            # optional raw frame log (replayable)

writer:
  flush_rows: 5000          # buffered rows per partition before a row group is written
  flush_interval_s: 5.0
  rotate_rows: 2000000      # finalise part-<n>.parquet after this many rows ...
  rotate_interval_s: 900.0  # ... or after this many seconds
  compression: zstd

session:
  backoff:
    initial_s: 0.5
    max_s: 30.0
    multiplier: 2.0
    jitter: 0.2
  redundant_connections: 2        # always-on overlapping connections per venue
  overlap_rotation: true          # open the replacement before closing (false = naive baseline)
  rotate_after_s: 72000.0         # planned overlapping reconnect before long-lived streams age out
  daily_rotation_utc: "00:00:05"  # also rotate after midnight so every day starts with a snapshot
  overlap_timeout_s: 15.0         # max wait for the new connection's first data before dropping old
  connect_timeout_s: 10.0
  resnapshot_interval_s: 600.0    # periodic REST snapshot for adapters that have one (none of the MOEX sources)
  max_message_bytes: 16777216
  seed: 7

dedup:
  enabled: true
  window_s: 120.0     # duplicates from redundant connections arrive within this window
  max_keys: 2000000

http:
  timeout_s: 10.0
  user_agent: tradeq-market-tape-recorder/0.1
  # Public-key pins (leaf SPKI SHA-256). A pinned host is accepted by pin + SAN instead of a chain;
  # every other host keeps certifi validation. T-Bank chains to the Russian Trusted Root CA, which
  # is not trusted here. REST and the MarketDataStream WebSocket both use invest-public-api.tbank.ru.
  # Pin taken 2026-11-05 with `tape pin-show invest-public-api.tbank.ru`: leaf CN=*.tbank.ru,
  # valid 2026-08-24 .. 2027-08-24, certificate SHA-256 fingerprint
  # 22:4F:05:8D:12:7B:C0:8F:78:3F:B9:BF:89:3E:9D:25:40:90:7D:A0:37:A5:DB:99:6A:4D:CB:6F:2D:06:23:99
  # (compare with the browser: padlock -> certificate -> SHA-256 fingerprint). On rotation, add
  # the new pin next to the old one, verify, then remove the old one.
  pins:
    invest-public-api.tbank.ru:
      - "sha256/xU/NS71QVL2qP8naQf6PUKFhVehLfvYnI4CFs5qo6iQ="

venues:
  # MOEX only (spec revision 2026-10-29). Venue names identify the capture source; see
  # ../docs/moex-sources.md. Lot sizes and ticks are checked against the exchange at runtime
  # (T-Bank ShareBy, ISS securities table) and a mismatch is logged.
  moex-tbank:
    adapter: tbank
    ws_url: wss://invest-public-api.tbank.ru/ws/tinkoff.public.invest.api.contract.v1.MarketDataStreamService/MarketDataStream
    rest_url: https://invest-public-api.tbank.ru/rest/
    rest_service_prefix: tinkoff.public.invest.api.contract.v1
    token_env: TBANK_TOKEN
    token_required: true
    ws_subprotocol: json
    book_depth: 20
    candle_interval: SUBSCRIPTION_INTERVAL_ONE_MINUTE
    timezone: Europe/Moscow
    session_window: {start: "06:50", end: "23:50", timezone: Europe/Moscow}
    channels: [trades, book_snapshot, candles, trading_status]
    symbols:
      SBER: {symbol: SBER-RUB-TQBR, contract_size: 1, tick: 0.01, board: TQBR}
      GAZP: {symbol: GAZP-RUB-TQBR, contract_size: 10, tick: 0.01, board: TQBR}
      LKOH: {symbol: LKOH-RUB-TQBR, contract_size: 1, tick: 0.5, board: TQBR}
  moex-algopack:
    adapter: moex_iss
    rest_url: https://apim.moex.com
    token_env: ALGOPACK_TOKEN
    token_required: true
    poll_interval_s: 2.0
    timezone: Europe/Moscow
    candle_interval: "1"
    session_window: {start: "06:50", end: "23:50", timezone: Europe/Moscow}
    channels: [trades, book_snapshot, candles, trading_status, tradestats, orderstats, obstats]
    rest_paths: &iss_paths
      trades: /iss/engines/{engine}/markets/{market}/boards/{board}/securities/{secid}/trades.json
      orderbook: /iss/engines/{engine}/markets/{market}/boards/{board}/securities/{secid}/orderbook.json
      candles: /iss/engines/{engine}/markets/{market}/boards/{board}/securities/{secid}/candles.json
      marketdata: /iss/engines/{engine}/markets/{market}/boards/{board}/securities/{secid}.json
      tradestats: /iss/datashop/algopack/eq/tradestats/{secid}.json
      orderstats: /iss/datashop/algopack/eq/orderstats/{secid}.json
      obstats: /iss/datashop/algopack/eq/obstats/{secid}.json
    rest_params: &iss_params
      trades: {"iss.meta": "off", "iss.only": "trades", "limit": "5000"}
      orderbook: {"iss.meta": "off", "iss.only": "orderbook"}
      candles: {"iss.meta": "off", "iss.only": "candles"}
      marketdata: {"iss.meta": "off", "iss.only": "securities,marketdata"}
      tradestats: {"iss.meta": "off", "latest": "1"}
      orderstats: {"iss.meta": "off", "latest": "1"}
      obstats: {"iss.meta": "off", "latest": "1"}
    poll_every:          # in polling rounds of poll_interval_s
      candles: 15        # 30 s
      marketdata: 15
      tradestats: 30     # 60 s; bars are published every 5 minutes
      orderstats: 30
      obstats: 30
    symbols: &moex_symbols
      SBER: {symbol: SBER-RUB-TQBR, contract_size: 1, tick: 0.01, engine: stock, market: shares, board: TQBR}
      GAZP: {symbol: GAZP-RUB-TQBR, contract_size: 10, tick: 0.01, engine: stock, market: shares, board: TQBR}
      LKOH: {symbol: LKOH-RUB-TQBR, contract_size: 1, tick: 0.5, engine: stock, market: shares, board: TQBR}
  moex-iss:
    # Public ISS without a token: 15-minute delayed trades and candles, no order book.
    adapter: moex_iss
    enabled: false
    rest_url: https://iss.moex.com
    poll_interval_s: 5.0
    timezone: Europe/Moscow
    candle_interval: "1"
    session_window: {start: "06:50", end: "23:50", timezone: Europe/Moscow}
    channels: [trades, candles, trading_status]
    rest_paths: *iss_paths
    rest_params: *iss_params
    poll_every: {candles: 6, marketdata: 6}
    symbols: *moex_symbols

quality:
  coverage_window: day        # "day" = venue session window; "observed" = first..last message
  alive_gap_s: 5.0            # silence longer than this breaks coverage
  book_compare_depth: 20      # levels compared between a snapshot and the reconstructed book
  price_tolerance: 1.0e-9
  size_rel_tolerance: 1.0e-9
  silence_s:
    book_snapshot: 120.0      # T-Bank pushes a book only when it changes; quiet names go silent
  checks:
    messages:                     {threshold: 1,    direction: min, severity: hard}
    sequence_gaps:                {threshold: 0,    direction: max, severity: soft}
    trade_id_gaps:                {threshold: 0,    direction: max, severity: soft}
    out_of_order_messages:        {threshold: 0,    direction: max, severity: soft}
    duplicate_messages:           {threshold: 0,    direction: max, severity: soft}
    crossed_book_events:          {threshold: 0,    direction: max, severity: soft}
    locked_book_events:           {threshold: 0,    direction: max, severity: soft}
    snapshot_mismatches:          {threshold: 0,    direction: max, severity: soft}
    resubscription_gap_ms_max:    {threshold: 250,  direction: max, severity: soft}
    clock_skew_p50_abs_ms:        {threshold: 1000, direction: max, severity: soft}
    clock_skew_negative_ratio:    {threshold: 0.01, direction: max, severity: soft}
    coverage_ratio:               {threshold: 0.99, direction: min, severity: soft}
    coverage_ratio_floor:         {threshold: 0.5,  direction: min, severity: hard}
  venue_overrides:
    moex-tbank:
      # Books are pushed only on change, so sub-second silence is normal and not a lost handover.
      resubscription_gap_ms_max:  {threshold: 1000, direction: max, severity: soft}
    moex-algopack:
      # ISS stamps trades and books to the second and is polled, so skew follows the poll interval.
      clock_skew_p50_abs_ms:      {threshold: 5000, direction: max, severity: soft}
      resubscription_gap_ms_max:  {threshold: 15000, direction: max, severity: soft}
    moex-iss:
      # Public ISS data is delayed by 15 minutes by design.
      clock_skew_p50_abs_ms:      {threshold: 960000, direction: max, severity: soft}
      resubscription_gap_ms_max:  {threshold: 30000, direction: max, severity: soft}

merge:
  primary_region: null        # rows that cannot be matched across regions come from this region
  latency_quantiles: [0.5, 0.9, 0.99]

archive:
  universe:
    - {venue: moex-tbank, symbol: SBER-RUB-TQBR}
    - {venue: moex-algopack, symbol: SBER-RUB-TQBR}
  channels: [trades, book_snapshot, candles, trading_status, tradestats, orderstats, obstats]
  name_template: "tradeq-tape-{month}.tar"
  report_name: QUALITY.md
  manifest_name: manifest.json

service:
  enabled: true
  host: 127.0.0.1
  port: 8602
  stale_after_s: 30.0

backfill:
  min_request_interval_s: 0.2   # T-Bank market data allows 600 unary calls per minute
  iss_page_rows: 500            # ISS candles page size; a full page is requested again with start=

download:                    # tape universe / tape download (bulk history, see README)
  dir: download                # checkpoints/ and reports/ under the project data subtree
  universe_file: universe_moex.json          # written to reference/
  i2_instruments_file: moex_instruments_i2.jsonl  # I2 moex.instruments file drop, in reference/
  share_boards: [TQBR]
  fund_boards: [TQTF, TQBR]    # T-Capital funds (reference/tbank_zero_fee_funds.json); they moved to TQBR in mid-2026
  shares_status: INSTRUMENT_STATUS_BASE  # ALL (~12 MB, all exchanges) is cut off by the server
  workers: 8                   # concurrent requests; the rate limiter is shared
  rate_fraction: 0.8           # pace at 80% of x-ratelimit-limit (600/min market data)
  default_limit_per_min: 600   # until the first answer reports the limit
  listing_interval_s: 5.0      # Shares/Etfs are listing methods: 15 calls per minute
  max_attempts: 6              # per request; 429 waits x-ratelimit-reset, 5xx/transport back off
  backoff_initial_s: 1.0
  backoff_max_s: 60.0
  commit_interval_s: 600.0     # finalise parts and save the checkpoint at least this often
  progress_interval_s: 30.0
  nice: 10                     # added to the process niceness (the recorder runs at priority.nice)
  recorder_load_url: http://127.0.0.1:8602/v1/load  # pause while pressure is high; null = never
  probe_interval_s: 5.0
  yield_sleep_s: 10.0
  minute_days: 365             # 1-minute history window
  daily_span_days: 2190        # GetCandles maximum per request: 1 day (1 min), 6 years (day)
  history_start: "1990-01-01"  # earliest daily date asked for (T-Bank and the ISS fallback)
  iss_fallback: true           # public ISS (venue moex-iss) for what T-Bank lacks
  iss_min_request_interval_s: 0.25
  calendar_threshold: 0.5      # a day is a trading day when this share of listed names has a bar
  part_index_gap: 1000         # part numbers far above the recorder's, so the two never collide

priority:
  nice: 0                    # negative values raise priority but need privileges
  probe_interval_s: 0.5
  lag_limit_ms: 200.0        # loop later than this -> pressure: high on /v1/load
  buffered_limit_rows: 200000
  window: 120                # lag samples kept (one minute at 0.5 s)

logging:
  level: INFO
  json_output: false

reference:                     # tape instruments-ref
  dir: reference
  zero_fee_fields: [asset.brand.company, asset.brand.name]
  # Confirmed 2026-11-05: the T-Capital funds carry asset.brand.company "Т-Капитал" (Cyrillic Т).
  zero_fee_pattern: "т-капитал|t-capital|тинькофф|tinkoff"
  min_request_interval_s: 0.35  # instruments service: 200 unary calls per minute

demo:
  fixtures_dir: tests/fixtures/venues   # relative to the repository root
  seed: 11
  # The two "regions" are two recorder hosts capturing the same MOEX sources.
  regions:
    msk:
      latency_ms: 2
      jitter_ms: 1
      faults:
        - {kind: duplicate, venue: moex-tbank, index: 4, delay_ms: 3}     # redundant copy (deduped)
        - {kind: resubscribe, venue: moex-tbank, index: 7, gap_ms: 1500}   # blind re-subscription
        - {kind: drop, venue: moex-algopack, index: 2}                     # lost poll; the TRADENO cursor recovers it
    eu:
      latency_ms: 31
      jitter_ms: 4
      faults:
        - {kind: cross, venue: moex-tbank, index: 5}                       # corrupted level crosses the book
        - {kind: cross, venue: moex-algopack, index: 3}                    # corrupted ISS book row
